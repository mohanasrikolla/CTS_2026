<h2>Available Courses</h2>

<input [(ngModel)]="searchTerm" placeholder="Search courses..." />

<p *ngIf="isLoading">Loading courses...</p>

<div class="course-grid" *ngIf="!isLoading">
  <ng-container *ngIf="filteredCourses.length > 0; else noCourses">
    <app-course-card
      *ngFor="let course of filteredCourses; trackBy: trackByCourseId"
      [course]="course"
      (enrollRequested)="onEnroll($event)">
    </app-course-card>
  </ng-container>

  <ng-template #noCourses>
    <p>No courses available.</p>
  </ng-template>
</div>

<p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>
