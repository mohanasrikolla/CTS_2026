<div class="course-card" [ngClass]="cardClasses" [ngStyle]="{ 'border-left-color': borderColor }" appHighlight="lightyellow">
  <h3>{{ course.name }}</h3>
  <p>{{ course.code }} — {{ course.credits | creditLabel }}</p>

  <!-- ngSwitch badge -->
  <span [ngSwitch]="course.gradeStatus" class="badge">
    <span *ngSwitchCase="'passed'" class="badge passed">Passed</span>
    <span *ngSwitchCase="'failed'" class="badge failed">Failed</span>
    <span *ngSwitchDefault class="badge pending">Pending</span>
  </span>

  <div class="actions">
    <button (click)="onEnrollClick()">Enroll</button>
    <button (click)="toggleExpand()">Show Details</button>
  </div>

  <div class="details" *ngIf="isExpanded">
    <p>Course ID: {{ course.id }}</p>
    <p>Status: {{ course.gradeStatus }}</p>
  </div>
</div>
